<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Reptilia</title>
  <!-- Black tile so the icon reads on light and dark tab bars -->
  <rect width="64" height="64" rx="14" fill="#000"/>
  <!-- The cobra's body twists into a DNA double helix (evolution) -->
  <g fill="none" stroke-linecap="round">
    <path d="M32 37 C46 41 46 47 32 49 C18 51 18 57 32 60" stroke="#e8d36a" stroke-width="5"/>
    <path d="M23.5 43 H40.5 M23.5 55 H40.5" stroke="#7fd1b9" stroke-width="3.2"/>
    <path d="M32 37 C18 41 18 47 32 49 C46 51 46 57 32 60" stroke="#c4753d" stroke-width="5"/>
  </g>
  <!-- Hood, seen from the front, with the pale belly scales down the middle -->
  <path d="M32 38 C17 36 8 25 13 13 C16 5 48 5 51 13 C56 25 47 36 32 38 Z" fill="#c4753d"/>
  <path d="M32 36 C26 32 25 24 27 17 H37 C39 24 38 32 32 36 Z" fill="#e8d36a"/>
  <!-- Head, eyes and forked tongue -->
  <ellipse cx="32" cy="12" rx="8.5" ry="6.5" fill="#a65c2c"/>
  <circle cx="28.4" cy="11" r="1.9" fill="#000"/>
  <circle cx="35.6" cy="11" r="1.9" fill="#000"/>
  <path d="M32 18 V22 M32 22 L30 24.5 M32 22 L34 24.5" stroke="#d62f2f" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
